# Codex's view of this rig's MCP server. Keep it in step with .mcp.json — same server name,
# same entry point, same env. The path is relative to the project directory, as in .mcp.json;
# never pin an absolute cwd, which is how the inf2 rig ended up pointing at a directory that
# does not exist.
#
# CORRECTED 2026-08-28. This file survived the G5g -> G6 fork completely unchanged and was
# wrong in three independent ways at once, which is why it is worth spelling out:
#   1. the server was registered as `gpu-jax-g5g-2b`, disagreeing with .mcp.json,
#      .claude-plugin/plugin.json and .claude/settings.local.json, which all say `gpu-jax-g6-2b`;
#   2. the entry point pointed at skills/gpu-jax-g5g-2b-management/, A PATH THAT DOES NOT
#      EXIST in this rig; and
#   3. -- the dangerous one -- the approval gates named `create_g5g_instance`,
#      `terminate_g5g_instance` and `stop_g5g_instance`. THIS RIG'S TOOLS ARE `*_g6_*`, so the
#      gates matched nothing and every destructive tool was UNGATED under Codex while
#      appearing to be gated. A gate on a tool name that does not exist fails open and is
#      silent about it.
# Ground truth for tool names: `grep -n "^@mcp.tool" server.py`.
[mcp_servers.gpu-jax-g6-2b]
command = "python3"
args = [".claude/skills/gpu-jax-g6-2b-management/mcp/server.py"]

[mcp_servers.gpu-jax-g6-2b.env]
AWS_REGION = "us-east-1"
MODEL_NAME = "google/gemma-4-E2B-it"
INSTANCE_TYPE = "g6.xlarge"
MCP_SERVER_NAME = "gpu-jax-g6-2b"

# Launching costs money, and a spot instance can be reclaimed under you. Gate the
# state-changing tools.
#
# Termination is NOT expensive here the way it is on the vLLM sibling: this rig builds
# nothing, so a relaunch costs a pip install and the model download, not a 67-minute
# compile plus an unlanded Triton patch. Gated anyway — it is still destructive, and a
# one-time spot instance cannot be stopped, only terminated.
[mcp_servers.gpu-jax-g6-2b.tools.create_g6_instance]
approval_mode = "approve"

[mcp_servers.gpu-jax-g6-2b.tools.terminate_g6_instance]
approval_mode = "approve"

[mcp_servers.gpu-jax-g6-2b.tools.stop_g6_instance]
approval_mode = "approve"

# Ships this rig's own source to the box and restarts the unit. Not destructive to AWS
# resources, but it replaces what is serving — and on a rig where a stale deploy once cost a
# full measure-and-conclude cycle, an explicit confirmation is cheap.
[mcp_servers.gpu-jax-g6-2b.tools.deploy_jax_server]
approval_mode = "approve"
