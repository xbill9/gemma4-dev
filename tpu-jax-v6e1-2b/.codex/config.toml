# Codex's view of this rig's MCP server. Keep it in step with .mcp.json — same server name,
# same entry point, same env. The values below are this rig's: pure-JAX Gemma 4 E2B on a
# single v6e chip, provisioned through Compute Engine rather than the Cloud TPU API.
[mcp_servers.tpu-jax-v6e1-2b]
command = "python3"
args = [".claude/skills/tpu-jax-v6e1-2b-management/mcp/server.py"]

[mcp_servers.tpu-jax-v6e1-2b.env]
MODEL_NAME = "google/gemma-4-E2B-it"
ACCELERATOR_TYPE = "v6e-1"
TENSOR_PARALLEL_SIZE = "1"
GOOGLE_CLOUD_PROJECT = "aisprint-491218"
GOOGLE_CLOUD_ZONE = "europe-west4-a"
GOOGLE_CLOUD_REGION = "europe-west4"
MCP_SERVER_NAME = "tpu-jax-v6e1-2b"
