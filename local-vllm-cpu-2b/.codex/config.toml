# Codex's view of this rig's MCP server. Keep it in step with .mcp.json — same server name,
# same entry point, same env. The path is relative to the project directory, as in .mcp.json;
# never pin an absolute cwd, which is how the inf2 rig ended up pointing at a directory that
# does not exist.
#
# This file, .mcp.json, .claude-plugin/plugin.json and .claude/settings.local.json's
# enabledMcpjsonServers must all name the server `gpu-jax-g4dn-2b`. The fork left this one
# naming `gpu-jax-g5g-2b` throughout — server name, skill path, instance type AND the three
# gated tool names, none of which this rig has (they are create_g4dn_instance and friends).
# A stale name here is invisible to the tests, because server.py was right the whole time.
[mcp_servers.gpu-jax-g4dn-2b]
command = "python3"
args = [".claude/skills/gpu-jax-g4dn-2b-management/mcp/server.py"]

[mcp_servers.gpu-jax-g4dn-2b.env]
AWS_REGION = "us-east-1"
MODEL_NAME = "google/gemma-4-E2B-it"
INSTANCE_TYPE = "g4dn.xlarge"
MCP_SERVER_NAME = "gpu-jax-g4dn-2b"

# Launching costs money, and a spot instance can be reclaimed under you. Gate the
# state-changing tools.
#
# Termination is NOT expensive here the way it is on the vLLM sibling: this rig builds
# nothing, so a relaunch costs a pip install and the model download, not a 67-minute
# compile plus an unlanded Triton patch. Gated anyway — it is still destructive, and a
# one-time spot instance cannot be stopped, only terminated.
[mcp_servers.gpu-jax-g4dn-2b.tools.create_g4dn_instance]
approval_mode = "approve"

[mcp_servers.gpu-jax-g4dn-2b.tools.terminate_g4dn_instance]
approval_mode = "approve"

[mcp_servers.gpu-jax-g4dn-2b.tools.stop_g4dn_instance]
approval_mode = "approve"
